name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t aws-eks-devsecops:${{ github.sha }} \
            ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.33.0
        with:
          image-ref: aws-eks-devsecops:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::474329324406:role/github-actions-ecr-devsecops
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: aws-eks-devsecops
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            aws-eks-devsecops:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
